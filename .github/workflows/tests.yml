name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .

      - name: Prove the null market is empty and no strategy sees the future
        run: python -m pytest tests/ -v

      # The permanent guard. If any strategy ever starts profiting from pure
      # randomness, that is a lookahead bug and the build must fail before the
      # commit is trusted -- not eighteen months later on real money.
      #
      # 60 markets of 1260 days rather than the full 200 x 2520: a GitHub runner
      # has two cores and the AI is roughly two seconds per market. This size
      # detects a leak comfortably (a peeking strategy scores t > 20, against a
      # threshold of 3) while finishing in a few minutes. The floors quoted
      # anywhere in the project come from the full local sweep recorded in
      # reports/, never from this run -- a p95 estimated from 60 samples is too
      # noisy to publish.
      - name: Prove no strategy profits from noise
        run: python experiments/null_test.py --markets 60 --steps 1260 --no-write
