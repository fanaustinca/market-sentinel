name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Prove the null market is genuinely empty
        run: python -m pytest tests/ -v
      # Phase 1 adds experiments/null_test.py here. Once the AI exists, this job
      # fails the build if it ever makes money on pure randomness.
